{% if not board.is_archived %}
<div class="mt-8">
  <h2 class="text-lg font-semibold mb-3">Upload Recording</h2>
  <form
    hx-post="/boards/{{ board_id }}/upload"
    hx-target="#upload-result"
    hx-swap="innerHTML"
    enctype="multipart/form-data"
    class="space-y-3"
  >
    <input
      type="file"
      name="file"
      accept="audio/*,video/*"
      class="block text-sm text-gray-600 file:mr-4 file:py-2 file:px-4
             file:rounded-lg file:border-0 file:text-sm file:font-semibold
             file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"
    />
    <p class="text-xs text-gray-400">Max 50 MB</p>
    <button
      type="submit"
      class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 text-sm"
    >
      Upload
    </button>
  </form>
  <div id="upload-result" class="mt-3"></div>
</div>

<div class="mt-8">
  <h2 class="text-lg font-semibold mb-3">Paste Transcript</h2>
  <form
    hx-post="/boards/{{ board_id }}/transcripts/paste"
    hx-target="#paste-result"
    hx-swap="innerHTML"
    class="space-y-3"
  >
    <textarea
      name="text"
      rows="6"
      maxlength="50000"
      placeholder="Paste transcript text here..."
      class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm
             placeholder:text-gray-400 focus:border-indigo-500 focus:ring-indigo-500"
    ></textarea>
    <button
      type="submit"
      class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 text-sm"
    >
      Save Transcript
    </button>
  </form>
  <div id="paste-result" class="mt-3"></div>
</div>
{% endif %}
