<div id="decision-{{ decision.id }}" class="bg-white rounded-lg shadow-sm p-4 mb-3">
    <p class="text-gray-800 mb-2">{{ decision.body }}</p>
    <div class="flex items-center justify-between text-xs text-gray-500">
        <span>{{ author_name or "Anonymous" }}</span>
        <div class="flex items-center gap-2">
            {% if can_edit %}
            <button
                hx-get="/boards/{{ board_id }}/decisions/{{ decision.id }}"
                hx-target="#decision-{{ decision.id }}"
                hx-swap="outerHTML"
                class="text-indigo-600 hover:text-indigo-800"
            >Edit</button>
            <button
                hx-delete="/boards/{{ board_id }}/decisions/{{ decision.id }}"
                hx-target="#decision-{{ decision.id }}"
                hx-swap="outerHTML"
                hx-confirm="Delete this decision?"
                class="text-red-600 hover:text-red-800"
            >Delete</button>
            {% endif %}
            <time datetime="{{ decision.created_at.isoformat() }}">{{ decision.created_at.strftime("%b %d, %Y %I:%M %p") }}</time>
        </div>
    </div>
</div>
