<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FollowThrough{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com/4.1.4"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    {% if current_user %}
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <a href="/boards" class="text-xl font-bold text-indigo-600">FollowThrough</a>
            <div class="flex items-center gap-4">
                <span class="text-sm text-gray-700">{{ current_user.name }}</span>
                <button
                    hx-post="/logout"
                    hx-swap="none"
                    class="text-sm text-gray-500 hover:text-gray-700"
                >
                    Logout
                </button>
            </div>
        </div>
    </header>
    {% endif %}
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
