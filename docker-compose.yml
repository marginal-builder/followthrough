services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: followthrough
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey:9
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/followthrough
      - VALKEY_URL=redis://valkey:6379/0
      - TEAM_PASSCODE=changeme
      - SESSION_SECRET=dev-secret-change-in-production
      - GROQ_API_KEY=
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/followthrough
      - VALKEY_URL=redis://valkey:6379/0
      - TEAM_PASSCODE=changeme
      - SESSION_SECRET=dev-secret-change-in-production
      - GROQ_API_KEY=
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - .:/app
    command: arq app.worker.settings.WorkerSettings

volumes:
  postgres_data:
  valkey_data: